# The stack of the run (SCOPE.md, "The stack of the run"): Keycloak plays the platform's IdP with one
# realm per tenant (research R-1), MongoDB is the application's store. The three Node services are not
# here: they run from the pnpm workspace so that the tests can start them with an injected clock (R-15).
#
# Secrets come from the environment only. `pnpm stack:up` generates them into a file in the OS temp
# directory and passes it with `--env-file`; nothing secret is written into this repository.
#
# The realm imports under infra/keycloak/realms/ carry no client secret and no user password:
# Keycloak 26.7.4 imports `${env.NAME}` literally instead of substituting it (facts.md, F11), so
# scripts/provision.ts sets both through the admin API after the import, from the same env file.
name: acme-idp-demo

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set it in the env file}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set it in the env file}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:18480
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18480:8080"
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  mongodb:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:18417:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
